<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>XREAL SIM</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#000; }
  canvas { display:block; position:fixed; inset:0; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ── setup ─────────────────────────────────────────────────────────────────────
const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');
let W, H;
function resize() { W = cvs.width = window.innerWidth; H = cvs.height = window.innerHeight; buildClouds(); }
window.addEventListener('resize', resize);

// ── stav ──────────────────────────────────────────────────────────────────────
let data = { yaw:0, pitch:0, hz:0, connected:false, calibrating:true, status:'…' };
let locked = false;
let lockPos = { yaw:0, pitch:0 };
let prevYaw = 0, prevPitch = 0, prevTime = Date.now();
let yawRate = 0, pitchRate = 0;

// ── WebSocket ─────────────────────────────────────────────────────────────────
function connect() {
  const ws = new WebSocket(`ws://${location.hostname}:8766`);
  ws.onmessage = e => {
    const d = JSON.parse(e.data);
    const now = Date.now();
    const dt = (now - prevTime) / 1000;
    if (dt > 0.001) {
      yawRate   = (d.yaw   - prevYaw)   / dt;
      pitchRate = (d.pitch - prevPitch) / dt;
    }
    prevYaw = d.yaw; prevPitch = d.pitch; prevTime = now;
    data = d;
  };
  ws.onclose = () => setTimeout(connect, 2000);
  ws.onerror = () => ws.close();
}
connect();

document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'KeyL') {
    locked = !locked;
    if (locked) { lockPos.yaw = data.yaw; lockPos.pitch = data.pitch; }
  }
});

// ── MRAKY ─────────────────────────────────────────────────────────────────────
let CLOUDS = [];
function buildClouds() {
  // deterministic seed
  const rng = (seed => { let s=seed; return ()=>{ s=(s*1664525+1013904223)&0xffffffff; return (s>>>0)/0xffffffff; }; })(42);
  CLOUDS = [];
  for (let i=0; i<22; i++) {
    CLOUDS.push({
      wx:  (rng()-0.5) * 160,          // světový úhel -80..+80°
      wy:  0.16 + rng() * 0.28,        // výška na obrazovce (nad horizontem)
      scale: 0.6 + rng() * 2.2,
      alpha: 0.18 + rng() * 0.32,
      puffs: Array.from({length: 7+Math.floor(rng()*5)}, () => ({
        dx: (rng()-0.5)*160,
        dy: (rng()-0.5)*30 - 10,
        r:  25 + rng()*55,
      })),
    });
  }
}
resize();

function drawCloud(cloud, screenX, screenY) {
  const s = cloud.scale;
  ctx.save();
  ctx.translate(screenX, screenY);
  ctx.globalAlpha = cloud.alpha;
  for (const p of cloud.puffs) {
    const grd = ctx.createRadialGradient(p.dx*s, p.dy*s*0.5, 0, p.dx*s, p.dy*s*0.5, p.r*s);
    grd.addColorStop(0,   'rgba(210,230,255,0.9)');
    grd.addColorStop(0.5, 'rgba(180,210,245,0.5)');
    grd.addColorStop(1,   'rgba(140,180,230,0)');
    ctx.beginPath();
    ctx.ellipse(p.dx*s, p.dy*s*0.5, p.r*s, p.r*s*0.55, 0, 0, Math.PI*2);
    ctx.fillStyle = grd;
    ctx.fill();
  }
  ctx.restore();
}

// ── util ─────────────────────────────────────────────────────────────────────
const HUD = '#00ff80';
const HUD2 = 'rgba(0,255,128,0.45)';
const HUDW = '#e8f4ff';
const CYAN = '#4dc3ff';
const YEL  = '#ffe040';
const RED  = '#ff5050';

function line(x1,y1,x2,y2, col=HUD, w=1) {
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2);
  ctx.strokeStyle=col; ctx.lineWidth=w; ctx.stroke();
}
function txt(s,x,y,{sz=13,col=HUD,align='left',bold=false}={}) {
  ctx.font=`${bold?'bold ':' '}${sz}px 'Courier New'`;
  ctx.fillStyle=col; ctx.textAlign=align; ctx.fillText(s,x,y);
}
function circle(x,y,r,col=HUD,w=1.5) {
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
  ctx.strokeStyle=col; ctx.lineWidth=w; ctx.stroke();
}

// ── KRESLENÍ ──────────────────────────────────────────────────────────────────
const FOV_H  = 50.0;   // horizontální FOV displeje
const PPD_H  = () => W / FOV_H;
const FOV_V  = 38.0;   // vertikální FOV
const PPD_V  = () => H / FOV_V;

function drawSky() {
  // obloha
  const HORIZ = H * 0.56;
  const sky = ctx.createLinearGradient(0, 0, 0, HORIZ);
  sky.addColorStop(0,    '#000a1e');
  sky.addColorStop(0.35, '#071e4a');
  sky.addColorStop(0.75, '#0d3577');
  sky.addColorStop(1,    '#1a5599');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, HORIZ);

  // pod horizontem – tmavá zemská tma
  const grd = ctx.createLinearGradient(0, HORIZ, 0, H);
  grd.addColorStop(0, '#050f1f');
  grd.addColorStop(1, '#000306');
  ctx.fillStyle = grd;
  ctx.fillRect(0, HORIZ, W, H - HORIZ);

  // horizontová záře
  const glow = ctx.createLinearGradient(0, HORIZ-60, 0, HORIZ+60);
  glow.addColorStop(0,   'rgba(30,100,200,0)');
  glow.addColorStop(0.4, 'rgba(60,140,230,0.18)');
  glow.addColorStop(0.5, 'rgba(120,190,255,0.32)');
  glow.addColorStop(0.6, 'rgba(20, 60,140,0.12)');
  glow.addColorStop(1,   'rgba(0,0,0,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, HORIZ-60, W, 120);
}

function drawClouds() {
  const ppd = PPD_H();
  const HORIZ = H * 0.56;
  for (const cl of CLOUDS) {
    const sx = W/2 + (-data.yaw + cl.wx) * ppd * 0.92; // mírný parallax
    if (sx < -400*cl.scale || sx > W + 400*cl.scale) continue;
    const sy = HORIZ * cl.wy;
    drawCloud(cl, sx, sy);
  }
}

function drawPitchLadder() {
  const ppd  = PPD_V();
  const ppdh = PPD_H();
  const cx   = W/2;
  ctx.save();
  ctx.setLineDash([5, 5]);

  for (let deg = -35; deg <= 35; deg += 5) {
    if (deg === 0) continue;
    const y = H/2 + (deg - data.pitch) * ppd;
    if (y < 40 || y > H-40) continue;
    const len = (deg % 10 === 0) ? 90 : 55;
    const alpha = 1 - Math.abs(deg - data.pitch) / 40;
    if (alpha < 0.1) continue;
    ctx.globalAlpha = Math.max(0.2, alpha * 0.8);
    line(cx-len, y, cx-18, y, HUD, 1);
    line(cx+18,  y, cx+len, y, HUD, 1);
    if (deg % 10 === 0) {
      ctx.globalAlpha *= 0.9;
      // vertikální tick na konci
      line(cx-len, y, cx-len, y - Math.sign(deg)*10, HUD, 1);
      line(cx+len, y, cx+len, y - Math.sign(deg)*10, HUD, 1);
      txt(`${deg>0?'+':''}${deg}`, cx-len-38, y+4, {sz:11});
      txt(`${deg>0?'+':''}${deg}`, cx+len+6,  y+4, {sz:11});
    }
  }
  ctx.setLineDash([]);
  ctx.globalAlpha = 1;

  // 0° horizont
  line(cx-110, H/2, cx-22, H/2, HUD, 2);
  line(cx+22,  H/2, cx+110, H/2, HUD, 2);
}

function drawHeadingTape() {
  const ppd = PPD_H();
  const cy  = 38;
  const hW  = 300;

  // pozadí pásky
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fillRect(W/2-hW, cy-22, hW*2, 44);
  line(W/2-hW, cy-22, W/2+hW, cy-22, HUD2);
  line(W/2-hW, cy+22, W/2+hW, cy+22, HUD2);

  // ticky každých 5°
  for (let d = -70; d <= 70; d += 5) {
    const x = W/2 + (d - data.yaw) * ppd;
    if (x < W/2-hW || x > W/2+hW) continue;
    const tick = d % 10 === 0 ? 12 : 6;
    line(x, cy-tick, x, cy+tick, HUD, d%10===0 ? 1.5 : 1);
    if (d % 10 === 0) {
      const hdg = ((Math.round(d) % 360) + 360) % 360;
      const label = hdg.toString().padStart(3,'0');
      txt(label, x, cy+24, {sz:11, align:'center'});
    }
  }

  // středový ukazatel
  ctx.fillStyle = HUD;
  ctx.beginPath();
  ctx.moveTo(W/2-6, cy-22);
  ctx.lineTo(W/2+6, cy-22);
  ctx.lineTo(W/2,   cy-12);
  ctx.closePath();
  ctx.fill();

  // aktuální heading číslo
  const curHdg = ((Math.round(-data.yaw) % 360) + 360) % 360;
  txt(curHdg.toString().padStart(3,'0'), W/2, cy+6,
      {sz:14, align:'center', bold:true});
}

function drawSpeedAlt() {
  // fake speed & altitude – pohybují se plynule
  const t = Date.now() / 1000;
  const spd = 480 + 15*Math.sin(t*0.3) + 8*Math.sin(t*0.7);
  const alt = 6500 + 200*Math.sin(t*0.2) + 80*Math.cos(t*0.5);

  const BAR_W = 72, BAR_H = 220, MID = H/2;

  // SPEED vlevo
  const sx = 60;
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fillRect(sx, MID-BAR_H/2, BAR_W, BAR_H);
  line(sx,        MID-BAR_H/2, sx+BAR_W, MID-BAR_H/2, HUD2);
  line(sx,        MID+BAR_H/2, sx+BAR_W, MID+BAR_H/2, HUD2);
  line(sx+BAR_W,  MID-BAR_H/2, sx+BAR_W, MID+BAR_H/2, HUD2);

  for (let v = Math.floor(spd/20)*20-80; v <= spd+80; v+=20) {
    const y = MID + (spd-v) * (BAR_H/160);
    if (y < MID-BAR_H/2+4 || y > MID+BAR_H/2-4) continue;
    line(sx+BAR_W-14, y, sx+BAR_W, y, HUD, 1);
    if (v%40===0) txt(`${v}`, sx+4, y+4, {sz:11});
  }
  // aktuální
  ctx.fillStyle='rgba(0,0,0,0.7)';
  ctx.fillRect(sx, MID-12, BAR_W+2, 24);
  line(sx, MID, sx+BAR_W+2, MID, HUD, 2);
  txt(`${Math.round(spd)}`, sx+BAR_W/2, MID+5,{sz:14,align:'center',bold:true});
  txt('kts', sx+BAR_W/2, MID-14, {sz:10,align:'center',col:'rgba(0,255,128,0.5)'});

  // ALT vpravo
  const ax = W - 60 - BAR_W;
  ctx.fillStyle='rgba(0,0,0,0.45)';
  ctx.fillRect(ax, MID-BAR_H/2, BAR_W, BAR_H);
  line(ax, MID-BAR_H/2, ax+BAR_W, MID-BAR_H/2, HUD2);
  line(ax, MID+BAR_H/2, ax+BAR_W, MID+BAR_H/2, HUD2);
  line(ax, MID-BAR_H/2, ax,       MID+BAR_H/2, HUD2);

  for (let v = Math.floor(alt/200)*200-800; v<=alt+800; v+=200) {
    const y = MID + (alt-v) * (BAR_H/1600);
    if (y < MID-BAR_H/2+4 || y > MID+BAR_H/2-4) continue;
    line(ax, y, ax+14, y, HUD, 1);
    if (v%400===0) txt(`${Math.round(v/100)*100}`, ax+18, y+4, {sz:11});
  }
  ctx.fillStyle='rgba(0,0,0,0.7)';
  ctx.fillRect(ax-2, MID-12, BAR_W+2, 24);
  line(ax-2, MID, ax+BAR_W, MID, HUD, 2);
  txt(`${Math.round(alt)}`, ax+BAR_W/2, MID+5, {sz:14,align:'center',bold:true});
  txt('ft', ax+BAR_W/2, MID-14, {sz:10,align:'center',col:'rgba(0,255,128,0.5)'});
}

function drawBoresight() {
  const cx = W/2, cy = H/2;
  const r = 14, arm = 24;
  circle(cx, cy, r, HUD, 1.5);
  line(cx-arm-r, cy, cx-r-2, cy, HUD, 1.5);
  line(cx+r+2,   cy, cx+arm+r, cy, HUD, 1.5);
  line(cx, cy-arm-r, cx, cy-r-2, HUD, 1.5);
  line(cx, cy+r+2,   cx, cy+arm+r, HUD, 1.5);
  // střední dot
  ctx.fillStyle=HUD; ctx.beginPath();
  ctx.arc(cx,cy,2,0,Math.PI*2); ctx.fill();
}

function drawReticle() {
  const ppd = PPD_H();
  const ppdv = PPD_V();
  const cx = W/2 - data.yaw   * ppd;
  const cy = H/2 + data.pitch * ppdv;

  const col = data.calibrating ? YEL : locked ? RED : CYAN;
  const r   = locked ? 18 : 12;
  const ARM = 36, GAP = r+4;

  // pulsace
  const pulse = locked ? r + 4*Math.sin(Date.now()/120) : r;

  ctx.setLineDash([4,4]);
  line(cx-ARM, cy, cx-GAP, cy, col, 1.8);
  line(cx+GAP, cy, cx+ARM, cy, col, 1.8);
  line(cx, cy-ARM, cx, cy-GAP, col, 1.8);
  line(cx, cy+GAP, cx, cy+ARM, col, 1.8);
  ctx.setLineDash([]);
  circle(cx, cy, pulse, col, locked ? 2.5 : 2);

  if (locked) {
    // lock tick marky
    for (let a=0; a<4; a++) {
      const angle = a*Math.PI/2 + Date.now()/1000*0.5;
      const x1 = cx + Math.cos(angle)*(pulse+6);
      const y1 = cy + Math.sin(angle)*(pulse+6);
      const x2 = cx + Math.cos(angle)*(pulse+16);
      const y2 = cy + Math.sin(angle)*(pulse+16);
      line(x1,y1,x2,y2,col,2);
    }
    txt('LOCK', cx, cy-pulse-12, {sz:12, col:RED, align:'center', bold:true});
  }

  // vzdálenost od středu
  const dist = Math.sqrt(data.yaw*data.yaw + data.pitch*data.pitch);
  if (dist > 0.5) {
    txt(`${dist.toFixed(1)}°`, cx+GAP+4, cy-8, {sz:11, col, align:'left'});
  }
}

function drawBankIndicator() {
  // odhadovaný bank z yaw rate (simplified)
  const bank = Math.max(-45, Math.min(45, yawRate * 2.5));
  const cx = W/2, cy = H/2;
  const R = 120;

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(-bank * Math.PI/180);

  // bank tiky (statické na letadle)
  for (const [a, len] of [[-45,8],[-30,6],[-20,5],[-10,4],[0,14],[10,4],[20,5],[30,6],[45,8]]) {
    const rad = (a-90)*Math.PI/180;
    const x1 = Math.cos(rad)*R, y1 = Math.sin(rad)*R;
    const x2 = Math.cos(rad)*(R-len), y2 = Math.sin(rad)*(R-len);
    line(x1,y1,x2,y2, HUD2, a===0?2:1);
  }

  // letadlo symbol
  ctx.strokeStyle = HUD; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-40,0); ctx.lineTo(-12,0);
  ctx.moveTo(12,0);  ctx.lineTo(40,0);
  ctx.moveTo(-6,0);  ctx.lineTo(0,-10);
  ctx.stroke();

  ctx.restore();
}

function drawG() {
  const g = 1.0 + Math.abs(pitchRate) * 0.08 + Math.abs(yawRate)*0.03;
  const col = g > 4 ? RED : g > 2.5 ? YEL : HUD;
  txt(`${g.toFixed(1)}G`, 24, H/2-30, {sz:14, col, bold:true});
}

function drawStatus() {
  const hzCol = data.hz > 50 ? HUD : data.hz > 20 ? YEL : RED;
  txt(`${data.hz.toFixed(0)} Hz`, 24, H-44, {sz:13, col:hzCol});
  txt(data.connected ? 'IMU OK' : 'NO IMU', 24, H-24, {sz:12, col: data.connected?HUD:'rgba(0,255,128,0.3)'});
  txt('SPC/L = LOCK', W-16, H-24, {sz:11, col:'rgba(0,255,128,0.3)', align:'right'});
  txt('XREAL SIM v0.1', W-16, H-44, {sz:11, col:'rgba(0,255,128,0.25)', align:'right'});
}

// ── HLAVNÍ SMYČKA ─────────────────────────────────────────────────────────────
function frame() {
  ctx.clearRect(0,0,W,H);
  ctx.globalAlpha = 1;
  ctx.setLineDash([]);

  drawSky();
  drawClouds();
  drawPitchLadder();
  drawHeadingTape();
  drawSpeedAlt();
  drawBankIndicator();
  drawBoresight();
  drawReticle();
  drawG();
  drawStatus();

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
