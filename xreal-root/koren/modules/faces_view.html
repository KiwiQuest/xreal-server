<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Tváře</title>
<style>
  /* Okno modulu Tváře v kořenové ploše. Černá / průhledná = v brýlích je vidět skutečný prostor.
     Vše je velké a kliká se myší hlavou (klik pohledem nebo tlačítkem brýlí). */
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:100%; height:100%; background:transparent; color:#c8ffe0; overflow:hidden;
    font-family:'Courier New',monospace; user-select:none; }
  button { font:15px 'Courier New',monospace; color:#00ff80; background:rgba(6,42,23,0.9); border:1px solid #1a6a40;
    padding:7px 12px; border-radius:4px; cursor:pointer; min-height:38px; }
  button:hover { border-color:#00ff80; background:#0d4a2a; }
  button.on { background:#00ff80; color:#000; }
  button.warn { color:#ffd200; border-color:#806a10; }
  button.big { font-size:18px; padding:10px 16px; min-height:48px; }

  #bar { position:absolute; left:0; right:0; top:0; height:50px; display:flex; align-items:center; gap:6px; padding:0 6px;
    background:rgba(0,20,10,0.7); border-bottom:1px solid #0d5a33; z-index:20; }
  #st { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:14px; }
  #st .dot { display:inline-block; width:10px; height:10px; border-radius:50%; background:#1a6a40; margin-right:6px; }
  #st .dot.on { background:#ff4040; box-shadow:0 0 6px #ff4040; }

  #stage { position:absolute; left:0; right:0; top:50px; bottom:0; }
  #video { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; }
  body.ar #video { visibility:hidden; }           /* jen popisky: černé pozadí = průhledné brýle */
  #boxes { position:absolute; inset:0; pointer-events:none; }
  #objs { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  .opts { display:flex; flex-wrap:wrap; gap:6px; margin:4px 0 10px; }
  .box { position:absolute; border:2px solid #8fd8ff; border-radius:6px; pointer-events:auto; cursor:pointer; }
  .box.known { border-color:#00ff80; }
  .box.maybe { border-color:#ffd200; border-style:dashed; }
  .box.unknown { border-color:#8fd8ff; border-style:dashed; }
  .box.small { opacity:.45; }
  .lab { position:absolute; left:50%; bottom:100%; transform:translate(-50%, -6px); white-space:nowrap; text-align:center;
    background:rgba(0,12,6,0.78); border:1px solid #0d5a33; border-radius:5px; padding:3px 10px; }
  .box.known .lab { border-color:#00ff80; }
  .lab .n { font-size:20px; color:#00ff80; }
  .box.maybe .lab .n { color:#ffd200; }
  .box.unknown .lab .n { color:#8fd8ff; font-size:16px; }
  .lab .d { font-size:13px; color:#8fd8b0; }
  .prog { position:absolute; left:0; right:0; bottom:-8px; height:6px; background:#062a17; }
  .prog div { height:100%; background:#00ff80; }

  #msg { position:absolute; left:50%; top:45%; transform:translate(-50%,-50%); font-size:20px; color:#ffd200; text-align:center;
    background:rgba(0,12,6,0.8); padding:14px 20px; border:1px solid #806a10; border-radius:6px; display:none; max-width:90%; }

  /* boční panel: lidé / fronta */
  #side { position:absolute; left:0; top:50px; bottom:0; width:min(360px, 45%); background:rgba(0,12,6,0.88);
    border-right:1px solid #0d5a33; overflow-y:auto; padding:8px; z-index:15; display:none; }
  #side.open { display:block; }
  #side h4 { font-weight:normal; color:#3fdc8c; letter-spacing:1px; margin:6px 0; }
  .row { display:flex; align-items:center; gap:8px; padding:6px; border:1px solid #0d5a33; border-radius:4px; margin-bottom:6px;
    cursor:pointer; min-height:56px; }
  .row:hover { border-color:#00ff80; }
  .row img, .noimg { width:48px; height:48px; border-radius:4px; flex:none; background:#062a17; }
  .row .t { flex:1; min-width:0; }
  .row .t div:first-child { font-size:16px; color:#00ff80; }
  .row .t div + div { font-size:12px; color:#8fd8b0; }
  .job { border:1px solid #0d5a33; border-radius:4px; padding:6px; margin-bottom:6px; font-size:14px; }
  .job.ask { border-color:#ffd200; }
  .job .acts { display:flex; gap:6px; margin-top:6px; flex-wrap:wrap; }
  .job .pics { display:flex; gap:6px; align-items:center; margin:4px 0; }
  .job .pics img { width:64px; height:64px; border-radius:4px; }

  /* osobní karta nad videem */
  #card { position:absolute; right:10px; top:60px; bottom:10px; width:min(420px, 60%); background:rgba(0,14,8,0.86);
    border:1px solid #00ff80; border-radius:8px; padding:12px; overflow-y:auto; z-index:18; display:none; }
  #card.open { display:block; }
  #card .head { display:flex; gap:12px; align-items:center; }
  #card .head img, #card .head .noimg { width:96px; height:96px; border-radius:6px; }
  #card .name { font-size:26px; color:#00ff80; word-break:break-word; }
  #card .rel { font-size:14px; color:#8fd8b0; }
  #card .sec { margin-top:10px; }
  #card .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  #card .kv { display:flex; justify-content:space-between; padding:3px 0; border-bottom:1px solid rgba(13,90,51,.35); font-size:14px; }
  #card .kv b { font-weight:normal; color:#2fa86a; }
  #card .note { font-size:15px; color:#c8ffe0; white-space:pre-wrap; min-height:22px; }
  #card .acts { display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
  #card input, #card textarea { width:100%; font:18px 'Courier New',monospace; color:#00ff80; background:#021a0e;
    border:1px solid #00ff80; border-radius:4px; padding:8px; margin-top:6px; }
  #card textarea { height:80px; resize:none; }
  .hint { font-size:12px; color:#2fa86a; margin-top:4px; }
</style>
</head>
<body>
<div id="bar">
  <div id="st"><span class="dot"></span>…</div>
  <button id="b-save" class="big" title="uložit největší tvář v záběru">+ ULOŽIT TVÁŘ</button>
  <button id="b-people">LIDÉ</button>
  <button id="b-queue">FRONTA</button>
  <button id="b-yolo" title="YOLO: postavy a věci kolem, model a zařízení">OBJEKTY</button>
  <button id="b-ar" title="skrýt video, nechat jen jména nad lidmi">JEN POPISKY</button>
  <button id="b-cam" title="zkusit jinou kameru">KAMERA ⟳</button>
</div>
<div id="stage">
  <img id="video" alt="">
  <canvas id="objs"></canvas>
  <div id="boxes"></div>
  <div id="msg"></div>
</div>
<div id="side"></div>
<div id="card"></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const cmd = (action, value) => fetch('/cmd', { method: 'POST',
  headers: { 'Content-Type': 'application/json', 'X-Koren': '1' },
  body: JSON.stringify({ module: 'faces', action, value }) }).then(() => setTimeout(poll, 120));
const setHtml = (el, h) => { if (el._h !== h) { el.innerHTML = h; el._h = h; } };
const RELS = ['rodina', 'přítel', 'kolega', 'soused', 'návštěva', 'jiné'];
let T = { tracks: [], people: [], queue: [] }, side = '', person = null, personAt = 0, edit = null, confirmDel = false;
let ar = false;
try { ar = localStorage.getItem('faces.ar') === '1'; } catch (e) {}

function ago(t) {
  if (!t) return '-';
  const s = Date.now() / 1000 - t;
  if (s < 60) return 'teď';
  if (s < 3600) return `před ${Math.round(s / 60)} min`;
  if (s < 86400) return `před ${Math.round(s / 3600)} h`;
  return new Date(t * 1000).toLocaleDateString('cs-CZ', { day: 'numeric', month: 'numeric', year: 'numeric' });
}
function when(t) {
  return t ? new Date(t * 1000).toLocaleString('cs-CZ', { day: 'numeric', month: 'numeric', year: 'numeric',
    hour: '2-digit', minute: '2-digit' }) : '-';
}
const thumb = (k, cls = '') => `<img class="${cls}" src="thumb?k=${encodeURIComponent(k)}" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'noimg'}))">`;

// ── video a rámečky ────────────────────────────────────────────────────────
function startVideo() {
  const v = $('video');
  v.src = 'video.mjpg?' + Date.now();
  v.onerror = () => setTimeout(startVideo, 1500);      // kořen se restartoval / kamera spadla
}
function videoRect() {
  // kde je obraz uvnitř <img> (object-fit: contain)
  const st = $('stage'), W = st.clientWidth, H = st.clientHeight;
  const iw = T.w || 16, ih = T.h || 9, s = Math.min(W / iw, H / ih);
  return { x: (W - iw * s) / 2, y: (H - ih * s) / 2, w: iw * s, h: ih * s };
}
// Rámečky se nepřekreslují, jen posouvají: prvek pod kurzorem myši hlavou musí přežít mezi
// stiskem a puštěním (klik pohledem), jinak by se klik ztratil.
const boxEls = new Map();
function renderBoxes() {
  const r = videoRect(), seen = new Set();
  for (const t of T.tracks) {
    seen.add(t.id);
    let el = boxEls.get(t.id);
    if (!el) { el = document.createElement('div'); el.dataset.id = t.id; $('boxes').appendChild(el); boxEls.set(t.id, el); }
    el.className = 'box ' + t.level + (t.small ? ' small' : '');
    el.dataset.pid = t.pid || ''; el.dataset.level = t.level;
    Object.assign(el.style, { left: r.x + t.x * r.w + 'px', top: r.y + t.y * r.h + 'px',
                              width: t.w * r.w + 'px', height: t.h * r.h + 'px' });
    let n, d = '';
    if (t.collect) { n = `Ukládám ${t.collect[0]}/${t.collect[1]}`; d = 'dívej se na tvář'; }
    else if (t.level === 'known') { n = esc(t.name); d = [t.relation, t.note].filter(Boolean).map(esc).join(' · '); }
    else if (t.level === 'maybe') { n = esc(t.name) + '?'; d = `možná · ${Math.round(t.sim * 100)} %`; }
    else { n = t.small ? 'tvář (daleko)' : '+ uložit tvář'; d = t.small ? 'přibliž se' : 'klikni'; }
    const prog = t.collect ? `<div class="prog"><div style="width:${100 * t.collect[0] / t.collect[1]}%"></div></div>` : '';
    setHtml(el, `<div class="lab"><div class="n">${n}</div>${d ? `<div class="d">${d}</div>` : ''}</div>${prog}`);
    // YOLO našlo postavu: jméno visí nad hlavou celé postavy, ne jen nad rámečkem tváře
    const lab = el.firstChild;
    const up = t.body ? Math.max(0, (t.y - t.body[1]) * r.h) : 0;
    lab.style.transform = `translate(-50%, ${-6 - up}px)`;
  }
  for (const [id, el] of boxEls) if (!seen.has(id)) { el.remove(); boxEls.delete(id); }
  renderObjects(r);
}
// objekty z YOLO: tenké rámečky / obrysy a česká jména, nejdou kliknout (neruší výběr tváří)
function renderObjects(r) {
  const cv = $('objs'), st = $('stage');
  if (cv.width !== st.clientWidth || cv.height !== st.clientHeight) { cv.width = st.clientWidth; cv.height = st.clientHeight; }
  const c = cv.getContext('2d');
  c.clearRect(0, 0, cv.width, cv.height);
  for (const o of T.objects || []) {
    const [x1, y1, x2, y2] = o.box, X = r.x + x1 * r.w, Y = r.y + y1 * r.h, W = (x2 - x1) * r.w, H = (y2 - y1) * r.h;
    const col = o.face != null ? '#00ff80' : o.color;
    c.strokeStyle = col; c.lineWidth = o.face != null ? 1.5 : 2; c.globalAlpha = o.face != null ? 0.5 : 0.85;
    if (o.poly && o.poly.length > 2) {
      c.beginPath(); o.poly.forEach(([px, py], i) => i ? c.lineTo(r.x + px * r.w, r.y + py * r.h) : c.moveTo(r.x + px * r.w, r.y + py * r.h));
      c.closePath(); c.fillStyle = col; c.globalAlpha = 0.18; c.fill(); c.globalAlpha = 0.85; c.stroke();
    } else c.strokeRect(X, Y, W, H);
    c.globalAlpha = 1;
    if (o.face != null) continue;                    // postavu s tváří popisuje jméno
    const txt = `${o.name} ${Math.round(o.conf * 100)} %`;
    c.font = '14px Courier New'; const tw = c.measureText(txt).width + 8;
    c.fillStyle = 'rgba(0,12,6,0.75)'; c.fillRect(X, Math.max(0, Y - 18), tw, 18);
    c.fillStyle = o.color; c.fillText(txt, X + 4, Math.max(13, Y - 5));
  }
}
$('boxes').addEventListener('click', e => {
  const b = e.target.closest('.box'); if (!b) return;
  if (b.dataset.level === 'known' && b.dataset.pid) cmd('card', b.dataset.pid);
  else cmd('enroll', +b.dataset.id);
});

// ── stavový pruh ────────────────────────────────────────────────────────────
function renderBar() {
  const on = T.state === 'on';
  const q = (T.queue || []).filter(j => ['queued', 'training', 'ask'].includes(j.status)).length;
  const asks = (T.queue || []).filter(j => j.status === 'ask').length;
  let s = { on: `KAMERA ${T.cam} · ${T.fps} fps · ${T.tracks.length} tváří`, opening: 'zapínám kameru…',
            error: 'kamera: ' + (T.error || 'chyba'), off: 'kamera vypnutá' }[T.state] || '…';
  s += ` · osob ${(T.people || []).length}`;
  setHtml($('st'), `<span class="dot ${on ? 'on' : ''}"></span>${esc(s)}`);
  $('b-queue').textContent = asks ? `FRONTA ⚠${asks}` : q ? `FRONTA ${q}` : 'FRONTA';
  $('b-queue').className = asks ? 'warn' : side === 'queue' ? 'on' : '';
  $('b-people').className = side === 'people' ? 'on' : '';
  const y = T.yolo || {};
  $('b-yolo').className = side === 'yolo' ? 'on' : y.on ? '' : 'warn';
  $('b-yolo').textContent = y.on ? 'OBJEKTY' : 'OBJEKTY ✕';
  $('b-ar').className = ar ? 'on' : '';
  document.body.classList.toggle('ar', ar);
  const m = $('msg');
  if (T.state === 'error') { m.style.display = 'block'; m.innerHTML = esc('Kamera: ' + (T.error || 'chyba'))
      + '<br><small>Zapni kameru Eye (Domov → Kamera Eye) nebo zkus KAMERA ⟳</small>'; }
  else if (T.state === 'opening') { m.style.display = 'block'; m.textContent = 'Zapínám kameru…'; }
  else if (on && !T.tracks.length && T.pending) { m.style.display = 'block'; m.textContent = 'Čekám na tvář v záběru…'; }
  else m.style.display = 'none';
}
$('b-save').onclick = () => cmd('enroll', null);
$('b-people').onclick = () => { side = side === 'people' ? '' : 'people'; renderSide(); renderBar(); };
$('b-queue').onclick = () => { side = side === 'queue' ? '' : 'queue'; renderSide(); renderBar(); };
$('b-yolo').onclick = () => { side = side === 'yolo' ? '' : 'yolo'; renderSide(); renderBar(); };
$('b-ar').onclick = () => { ar = !ar; try { localStorage.setItem('faces.ar', ar ? '1' : '0'); } catch (e) {} renderBar(); };
$('b-cam').onclick = () => cmd('nextcam');

// ── boční panel ─────────────────────────────────────────────────────────────
const STATUS = { queued: 've frontě', training: 'trénuji…', ask: 'čeká na odpověď', done: 'hotovo', failed: 'nepovedlo se' };
function renderSide() {
  const el = $('side');
  el.classList.toggle('open', !!side);
  if (side === 'people') {
    const p = T.people || [];
    setHtml(el, `<h4>LIDÉ (${p.length})</h4>` + (p.length ? p.map(x => `<div class="row" data-pid="${x.pid}">
        ${thumb(x.pid)}<div class="t"><div>${esc(x.name)}</div>
        <div>${esc(x.relation || '')}${x.relation ? ' · ' : ''}viděn ${ago(x.last_seen)} · ${x.samples} snímků</div></div></div>`).join('')
      : '<div class="hint">Zatím nikdo. Klikni na rámeček kolem tváře nebo na + ULOŽIT TVÁŘ.</div>'));
  } else if (side === 'queue') {
    const q = (T.queue || []).slice().reverse();
    setHtml(el, `<h4>FRONTA TRÉNOVÁNÍ</h4>` + (q.length ? q.map(j => {
      const cand = j.cand && (T.people || []).find(p => p.pid === j.cand);
      const ask = j.status === 'ask';
      return `<div class="job ${ask ? 'ask' : ''}"><div>${j.kind === 'add' ? 'doplnění snímků' : 'nová tvář'} · ${STATUS[j.status] || j.status}</div>
        <div class="hint">${esc(j.msg || '')}</div>
        ${ask ? `<div class="pics">${thumb('j:' + j.id)}<span>≈</span>${cand ? thumb(cand.pid) : ''}</div>
          <div>Je to <b>${esc(cand ? cand.name : '?')}</b>?</div>
          <div class="acts"><button class="big" data-jid="${j.id}" data-same="1">ANO, STEJNÁ OSOBA</button>
          <button class="big" data-jid="${j.id}" data-same="0">NE, NOVÁ OSOBA</button></div>` : ''}</div>`;
    }).join('') : '<div class="hint">Fronta je prázdná.</div>'));
  } else if (side === 'yolo') {
    const y = T.yolo || {}, opt = (k, v, l) => `<button class="${y[k] === v ? 'on' : ''}" data-k="${k}" data-v="${v}">${l}</button>`;
    const counts = {};
    for (const o of T.objects || []) counts[o.name] = (counts[o.name] || 0) + 1;
    // tlačítka zvlášť od živých čísel: nepřekreslují se pod kurzorem myši hlavou
    setHtml(el, `<h4>OBJEKTY (YOLO)</h4>
      <div class="opts"><button class="big ${y.on ? 'on' : ''}" data-a="yolo">${y.on ? 'ZAPNUTO' : 'VYPNUTO'}</button></div>
      <div class="hint" id="yolive"></div>
      <h4>Model</h4><div class="opts">${opt('size', 'n', 'n rychlý')}${opt('size', 's', 's')}${opt('size', 'm', 'm přesný')}</div>
      <div class="opts">${opt('task', 'det', 'rámečky')}${opt('task', 'seg', 'obrysy')}</div>
      <h4>Zařízení</h4><div class="opts">${opt('backend', 'openvino:npu', 'NPU')}${opt('backend', 'openvino:gpu', 'GPU')}
        ${opt('backend', 'openvino:cpu', 'CPU')}${opt('backend', 'torch:cpu', 'PyTorch')}</div>
      <h4>V záběru</h4><div class="hint" id="yocount"></div>
      <div class="hint">YOLO hledá postavy a věci, jméno člověka určuje rozpoznání tváře.</div>`);
    setHtml($('yolive'), esc(y.status || '') + (y.on && y.fps ? ` · ${y.fps} sn/s · ${y.ms} ms` : ''));
    setHtml($('yocount'), Object.entries(counts).map(([n, k]) => `${esc(n)} ${k}×`).join(' · ') || 'nic');
  } else setHtml(el, '');
}
$('side').addEventListener('click', e => {
  const r = e.target.closest('.row'); if (r) { cmd('card', r.dataset.pid); return; }
  const o = e.target.closest('button[data-k]'); if (o) { cmd('yolo_set', { [o.dataset.k]: o.dataset.v }); return; }
  if (e.target.closest('button[data-a=yolo]')) { cmd('yolo'); return; }
  const b = e.target.closest('button[data-jid]');
  if (b) cmd('resolve', { jid: b.dataset.jid, same: b.dataset.same === '1' });
});

// ── osobní karta ───────────────────────────────────────────────────────────
function loadPerson(pid) {
  fetch('person?pid=' + encodeURIComponent(pid)).then(r => r.ok ? r.json() : null).then(p => {
    person = p; personAt = Date.now(); renderCard();
  }).catch(() => {});
}
function renderCard() {
  const el = $('card'), pid = T.card;
  el.classList.toggle('open', !!pid);
  if (!pid) { person = null; edit = null; confirmDel = false; setHtml(el, ''); return; }
  if (!person || person.pid !== pid) { edit = null; confirmDel = false; if (!person || Date.now() - personAt > 300) loadPerson(pid);
    if (!person || person.pid !== pid) return; }
  const p = person, live = T.tracks.find(t => t.pid === pid && t.level === 'known');
  let h = `<div class="head">${thumb(pid)}<div><div class="name">${esc(p.name)}</div>
      <div class="rel">${esc(p.relation || 'vztah nezadán')}${live ? ' · <span style="color:#00ff80">● teď v záběru</span>' : ''}</div></div></div>`;
  if (edit === 'name' || edit === 'note') {
    const val = edit === 'name' ? p.name : (p.note || '');
    h += `<div class="sec">${edit === 'name' ? 'Jméno' : 'Popis / poznámka'}:</div>`
      + (edit === 'name' ? `<input id="ed" maxlength="60" value="${esc(val)}">` : `<textarea id="ed" maxlength="200">${esc(val)}</textarea>`)
      + `<div class="hint">Klikni do pole a piš klávesnicí na obrazovce.</div>
         <div class="acts"><button class="big" data-a="kbd">⌨ KLÁVESNICE</button><button class="big" data-a="save">✓ ULOŽIT</button>
         <button class="big" data-a="cancel">ZPĚT</button></div>`;
  } else {
    h += `<div class="sec">Vztah:</div><div class="chips">` + RELS.map(r =>
      `<button class="${p.relation === r ? 'on' : ''}" data-rel="${r}">${r}</button>`).join('') + `</div>`
      + `<div class="sec">Popis:</div><div class="note">${esc(p.note || '—')}</div>`
      + `<div class="sec">`
      + `<div class="kv"><b>Poprvé viděn</b><span>${when(p.first_seen)}</span></div>`
      + `<div class="kv"><b>Naposledy</b><span>${live ? 'teď' : ago(p.last_seen)}</span></div>`
      + `<div class="kv"><b>Návštěv</b><span>${p.seen || 0}</span></div>`
      + `<div class="kv"><b>Snímků v galerii</b><span>${p.samples}${p.auto ? ` (${p.auto} doučeno samo)` : ''}</span></div>`
      + `<div class="kv"><b>Uložen</b><span>${when(p.created)}</span></div></div>`
      + `<div class="acts"><button class="big" data-a="name">✎ JMÉNO</button><button class="big" data-a="note">✎ POPIS</button>
         <button class="big" data-a="more">+ DOPLNIT SNÍMKY</button>`
      + (confirmDel ? `<button class="big warn" data-a="delyes">ANO, SMAZAT</button><button class="big" data-a="delno">NE</button>`
                    : `<button class="big warn" data-a="del">SMAZAT</button>`)
      + `<button class="big" data-a="close">✕ ZAVŘÍT</button></div>
         <div class="hint">Zavřít jde i zavrtěním hlavou.</div>`;
  }
  setHtml(el, h);
}
$('card').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || !person) return;
  const pid = person.pid;
  if (b.dataset.rel) { cmd('edit', { pid, relation: person.relation === b.dataset.rel ? '' : b.dataset.rel }); setTimeout(() => loadPerson(pid), 250); return; }
  const a = b.dataset.a;
  if (a === 'name' || a === 'note') { edit = a; renderCard(); const f = $('ed'); if (f) { f.focus(); f.select && a === 'name' && f.select(); } }
  else if (a === 'kbd') { const f = $('ed'); if (f) f.focus(); cmd('keyboard', {}); }
  else if (a === 'save') { const f = $('ed'); if (f) cmd('edit', { pid, [edit]: f.value }); edit = null; cmd('keyboard', { close: 1 });
    setTimeout(() => loadPerson(pid), 250); }
  else if (a === 'cancel') { edit = null; cmd('keyboard', { close: 1 }); renderCard(); }
  else if (a === 'more') cmd('add_samples', { pid });
  else if (a === 'del') { confirmDel = true; renderCard(); }
  else if (a === 'delno') { confirmDel = false; renderCard(); }
  else if (a === 'delyes') { confirmDel = false; cmd('delete_now', { pid }); }
  else if (a === 'close') cmd('card_close');
});
$('card').addEventListener('keydown', e => { if (e.key === 'Enter' && edit === 'name') { e.preventDefault(); $('card').querySelector('[data-a=save]').click(); } });

// ── data ────────────────────────────────────────────────────────────────────
let busy = false, lastCard = null;
function poll() {
  if (busy) return; busy = true;
  fetch('tracks').then(r => r.json()).then(d => {
    T = d; T.tracks = T.tracks || [];
    renderBoxes(); renderBar();
    if (side) renderSide();
    if (T.card !== lastCard) { lastCard = T.card; person = null; }
    if (T.card && person && Date.now() - personAt > 3000 && edit === null) loadPerson(T.card);
    if (edit === null) renderCard(); else $('card').classList.toggle('open', !!T.card);
  }).catch(() => {}).finally(() => { busy = false; });
}
setInterval(poll, 120);
addEventListener('resize', renderBoxes);
startVideo();
poll();
</script>
